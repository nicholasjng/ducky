name: UndefinedBehaviorSanitizer check

# A cold instrumented build of DuckDB takes about 30 minutes, so this runs
# weekly and on demand rather than for every change.
on:
  schedule:
    - cron: "11 4 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  ubsan:
    name: ubsan · ubuntu
    runs-on: ubuntu-latest
    # An instrumented Debug build of DuckDB takes most of the job.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.15"

      - uses: $/.github/actions/duckdb

      - name: Build the UBSAN editable install
        env:
          CC: gcc
          CXX: g++
        run: DUCKY_UBSAN=1 uv sync --frozen --group dev --reinstall-package=ducky

      # Preload the GCC runtime and libstdc++ used by the instrumented extension.
      - name: Run tests under UndefinedBehaviorSanitizer
        run: |
          LD_PRELOAD="$(gcc -print-file-name=libubsan.so) $(gcc -print-file-name=libstdc++.so)" \
          UBSAN_OPTIONS="halt_on_error=1:print_stacktrace=1:log_path=$RUNNER_TEMP/ubsan-report" \
            .venv/bin/python -m pytest --capture no

      - name: Print UndefinedBehaviorSanitizer reports
        if: always()
        run: |
          for report in "$RUNNER_TEMP"/ubsan-report.*; do
            if [[ -f "$report" ]]; then
              cat "$report"
            fi
          done

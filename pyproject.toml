[build-system]
requires = ["scikit-build-core >=1.0,<2", "nanobind >=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "ducky"
description = "small and fast duckdb bindings"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Nicholas Junge", email = "nicho.junge@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    'typing_extensions >=4.12 ; python_version < "3.12"', # for typing.Unpack (PEP 692).
]
dynamic = ["version"]

[dependency-groups]
build = [
    "nanobind>=3.0",
    "ruff>=0.16.7",  # keep stub formatting in sync with the repository hook.
    "scikit-build-core >=1.0,<2",
]
dev = [
    "jax>=0.10.1",
    "mlx>=0.31.2",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "polars>=1.40.1",
    "pyarrow>=24.0.0",
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "torch>=2.12.0",
    "tqdm>=4.66",
]
typing = [
    "ty>=0.0.35",
]
bench = [
    "duckdb>=1.5",
    "mew-bench",
    "memray>=1.18",
    "numpy>=2.4.6",
    "pyarrow>=24.0.0",
]

[tool.uv.sources]
mew-bench = { path = "../mew", editable = true }

[tool.uv]
exclude-newer = "1 week"
exclude-newer-package = { nanobind = false, ruff = false, ty = false }
# Keep contributor build tools available for CMake and stub targets.
default-groups = ["build"]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/ducky"]
cmake.version = ">=3.29"
cmake.build-type = "Release"
logging.level = "INFO"

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "src/ducky/__init__.py"

[tool.scikit-build.cmake.define]
CMAKE_EXPORT_COMPILE_COMMANDS = "ON"

[[tool.scikit-build.overrides]]
if.env.DUCKY_ASAN = "1"
build-dir = "build/asan"
cmake.build-type = "Debug"
cmake.args = ["-DDUCKY_ASAN=ON"]

# RelWithDebInfo: Release optimizations + debug symbols. Lets atos/perf/dtrace
# symbolize ducky frames in profiles. On macOS, dwarf stays in the .o files
# and atos finds it as long as the build tree is intact (no need for a dSYM).
[[tool.scikit-build.overrides]]
if.env.DUCKY_RELDBG = "1"
build-dir = "build/reldbg"
cmake.build-type = "RelWithDebInfo"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["BLE001", "DTZ001", "PLW1510"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
